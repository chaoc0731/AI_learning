<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗关系抽取系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .result-card {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }
        .relation-badge {
            font-size: 1.2em;
            padding: 8px 16px;
            border-radius: 20px;
        }
        .confidence-bar {
            height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }
        .confidence-fill {
            height: 100%;
            background: white;
            border-radius: 5px;
            transition: width 0.5s ease;
        }
        .example-text {
            cursor: pointer;
            color: #667eea;
            text-decoration: underline;
        }
        .example-text:hover {
            color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- 标题 -->
                <div class="text-center mb-5">
                    <h1 class="text-white mb-3">
                        <i class="fas fa-heartbeat me-3"></i>
                        医疗关系抽取系统
                    </h1>
                    <p class="text-white-50">基于BERT的医疗实体关系识别</p>
                </div>

                <!-- 主卡片 -->
                <div class="card">
                    <div class="card-body p-4">
                        <h4 class="card-title mb-4">
                            <i class="fas fa-search me-2"></i>关系抽取分析
                        </h4>

                        <!-- 输入表单 -->
                        <form id="relationForm">
                            <div class="mb-3">
                                <label for="text" class="form-label">医疗文本</label>
                                <textarea class="form-control" id="text" rows="3"
                                          placeholder="请输入医疗文本，例如：患者服用阿司匹林后头痛症状明显缓解"
                                          required></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="entity1" class="form-label">实体1</label>
                                        <input type="text" class="form-control" id="entity1"
                                               placeholder="例如：阿司匹林" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="entity2" class="form-label">实体2</label>
                                        <input type="text" class="form-control" id="entity2"
                                               placeholder="例如：头痛" required>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <small class="text-muted">
                                    <i class="fas fa-lightbulb me-1"></i>
                                    示例文本：
                                    <span class="example-text" onclick="fillExample(0)">阿司匹林治疗头痛</span> |
                                    <span class="example-text" onclick="fillExample(1)">糖尿病引起视网膜病变</span> |
                                    <span class="example-text" onclick="fillExample(2)">CT检查诊断肺癌</span>
                                </small>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-primary" id="analyzeBtn">
                                    <i class="fas fa-play me-2"></i>开始分析
                                </button>
                            </div>
                        </form>

                        <!-- 加载动画 -->
                        <div id="loading" class="text-center mt-4" style="display: none;">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">分析中...</span>
                            </div>
                            <p class="mt-2 text-muted">正在分析实体关系...</p>
                        </div>

                        <!-- 结果显示 -->
                        <div id="result" style="display: none;"></div>
                    </div>
                </div>

                <!-- 关系类型说明 -->
                <div class="card mt-4">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="fas fa-info-circle me-2"></i>支持的关系类型
                        </h5>
                        <div class="row" id="relationTypes">
                            <!-- 关系类型将通过JavaScript动态加载 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 示例数据
        const examples = [
            {
                text: "患者服用阿司匹林后头痛症状明显缓解",
                entity1: "阿司匹林",
                entity2: "头痛"
            },
            {
                text: "糖尿病可能引起视网膜病变",
                entity1: "糖尿病",
                entity2: "视网膜病变"
            },
            {
                text: "CT检查可以帮助诊断肺癌",
                entity1: "CT检查",
                entity2: "肺癌"
            }
        ];

        // 填充示例文本
        function fillExample(index) {
            const example = examples[index];
            document.getElementById('text').value = example.text;
            document.getElementById('entity1').value = example.entity1;
            document.getElementById('entity2').value = example.entity2;
        }

        // 加载关系类型
        async function loadRelationTypes() {
            try {
                const response = await fetch('/relations');
                const data = await response.json();
                const relations = data.relations;

                const container = document.getElementById('relationTypes');
                container.innerHTML = '';

                relations.forEach(relation => {
                    const col = document.createElement('div');
                    col.className = 'col-md-4 mb-2';
                    col.innerHTML = `
                        <span class="badge bg-primary">${relation}</span>
                    `;
                    container.appendChild(col);
                });
            } catch (error) {
                console.error('加载关系类型失败:', error);
            }
        }

        // 表单提交处理
        document.getElementById('relationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const text = document.getElementById('text').value;
            const entity1 = document.getElementById('entity1').value;
            const entity2 = document.getElementById('entity2').value;

            // 显示加载动画
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('analyzeBtn').disabled = true;

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        entity1: entity1,
                        entity2: entity2
                    })
                });

                const result = await response.json();

                // 隐藏加载动画
                document.getElementById('loading').style.display = 'none';
                document.getElementById('analyzeBtn').disabled = false;

                // 显示结果
                displayResult(result);

            } catch (error) {
                console.error('分析失败:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('analyzeBtn').disabled = false;
                alert('分析失败，请检查网络连接或服务状态');
            }
        });

        // 显示结果
        function displayResult(result) {
            const resultDiv = document.getElementById('result');
            const confidencePercent = (result.confidence * 100).toFixed(1);

            resultDiv.innerHTML = `
                <div class="result-card mt-4">
                    <h5 class="mb-3">
                        <i class="fas fa-chart-bar me-2"></i>分析结果
                    </h5>
                    <div class="row align-items-center">
                        <div class="col-md-6">
                            <p class="mb-1"><strong>实体1:</strong> ${result.entity1}</p>
                            <p class="mb-1"><strong>实体2:</strong> ${result.entity2}</p>
                            <p class="mb-2"><strong>识别关系:</strong></p>
                            <span class="badge relation-badge bg-success">${result.relation}</span>
                        </div>
                        <div class="col-md-6">
                            <p class="mb-2"><strong>置信度: ${confidencePercent}%</strong></p>
                            <div class="confidence-bar">
                                <div class="confidence-fill" style="width: ${confidencePercent}%"></div>
                            </div>
                            <p class="mb-0"><small>模型对该关系的置信程度</small></p>
                        </div>
                    </div>
                    <div class="mt-3 p-3 bg-white bg-opacity-10 rounded">
                        <strong>原文:</strong> ${result.text}
                    </div>
                </div>
            `;
            resultDiv.style.display = 'block';

            // 滚动到结果位置
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }

        // 页面加载时获取关系类型
        document.addEventListener('DOMContentLoaded', function() {
            loadRelationTypes();
        });
    </script>
</body>
</html>
